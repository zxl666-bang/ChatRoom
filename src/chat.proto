syntax = "proto3";

package chat;

message ChatPacket {
    enum Type {
        UNKNOWN = 0;
        TEXT = 1;
        PRIVATE = 2;
        GROUP = 3;
        FILE = 4;
        LOGIN = 5;
        REGISTER = 6;
        SYSTEM = 7;
        HEARTBEAT = 8;
    }
    Type type = 1;
    string text = 2;
    string username = 3;
    string receiver = 4;
    string group_id = 5;
    string file_id = 6;
    uint64 offset = 7;
    bytes payload = 8;
    uint64 file_size = 9;
    string filename = 10;
    string password = 11;
    string message_id = 12;
    int64 timestamp = 13;
    int32 status = 14;
    string status_message = 15;
    string extra = 16;
}